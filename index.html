<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>RPH Sains Tahun 4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">
      <div class="brand-icon"><i class="bi bi-journal-richtext"></i></div>
      <div>
        <div class="brand-title">RPH Sains Tahun 4</div>
        <div class="brand-subtitle">SK Kuala Betis · Sesi 2026</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="exportBtn" title="Eksport backup"><i class="bi bi-download"></i><span>Backup</span></button>
      <label class="icon-btn" title="Import backup">
        <i class="bi bi-upload"></i><span>Import</span>
        <input type="file" id="importInput" accept=".json" hidden>
      </label>
      <button class="icon-btn danger" id="resetAllBtn" title="Reset semua"><i class="bi bi-arrow-counterclockwise"></i><span>Reset</span></button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar no-print">
      <div class="sidebar-heading">
        <span>Minggu</span>
        <span class="count">1–43</span>
      </div>
      <div class="week-grid" id="weekGrid"></div>
    </aside>

    <section class="content">
      <div class="content-head no-print">
        <div>
          <div class="eyebrow">RANCANGAN PENGAJARAN HARIAN</div>
          <h1 id="weekTitle">Minggu 1</h1>
          <p id="weekMeta">2 RPH · Semua perubahan disimpan dalam peranti ini.</p>
        </div>
        <div class="head-actions">
          <button class="btn secondary" id="resetWeekBtn"><i class="bi bi-arrow-clockwise"></i> Reset minggu</button>
          <button class="btn primary" id="printBtn"><i class="bi bi-printer"></i> Cetak</button>
        </div>
      </div>

      <div id="rphContainer"></div>
    </section>
  </main>

  <div class="toast no-print" id="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
